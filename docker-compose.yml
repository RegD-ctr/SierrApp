services:
  db:
    image: postgres:16
    container_name: sierra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sierra_app
    ports:
      - "5432:5432"
    volumes:
      - sierra_pgdata:/var/lib/postgresql/data

volumes:
  sierra_pgdata:
